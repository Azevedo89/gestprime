<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · GestPrime</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { --navy: #0d2148; --navy-deep: #081634; --gold: #e2c27a; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        text-align: center; padding: 32px; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, var(--navy) 0%, var(--navy-deep) 100%);
      }
      img { height: 64px; width: auto; margin-bottom: 32px; }
      h1 { font-family: Georgia, serif; font-size: clamp(3rem, 12vw, 5rem); margin: 0; color: var(--gold); }
      p { font-size: 1.1rem; color: rgba(255,255,255,.8); margin: 8px 0 32px; }
      a {
        display: inline-block; text-decoration: none; font-weight: 700; color: var(--navy-deep);
        background: var(--gold); padding: 14px 30px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-light.png" alt="GestPrime" />
      <h1>404</h1>
      <p>Página não encontrada. / Page not found.</p>
      <a href="/">Voltar ao início / Back home</a>
    </main>
  </body>
</html>
